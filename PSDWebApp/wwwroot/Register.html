<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>PSD Conference</title>
    <link href="styles/maincontent.css" rel="stylesheet" />
    <link href="styles/nav.css" rel="stylesheet" />
    <link href="styles/register.css" rel="stylesheet" />

</head>
<body>
    <div class="container">
        <header>
            <img src="images/sponsors/psd-logo.jpg" alt="PSD Logo" />
        </header>
        <section class="content">
            <nav>
                <div class="nav-container">
                    <a href="Home.html" >Home</a>
                    <a href="Register.html" class="active">Register</a>
                    <a href="AboutUs.html">About US</a>
                </div>
            </nav>

            <section id="registerSection" class="register">
                <div class="register-container">
                    <h1>Registeration Form</h1>
                    <form>
                        <div class="field">
                            <label for="name">Name:</label>
                            <input type="text" id="first-name" name="name" autofocus required />
                        </div>
                        <div class="field">
                            <label for="password">Password:</label>
                            <input type="password" id="password" 
                                   name="password" 
                                   required pattern="^\d{6}?" 
                                   title="6 digits is required"/>
                        </div>
                        <div class="field">
                            <label for="cities">Cities:</label>
                            <select>
                                <option>Select ...</option>
                                <option value="1">Riyadh</option>
                                <option value="2">Jeddah</option>
                                <option value="3">Madinah</option>
                            </select>
                        </div>
                        <div class="field">
                            <button type="submit" onclick="return registerValidation()" >Register</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="register-sent">
                <h1>Thanks for Registering with Us!</h1>
            </section>

        </section>
        <footer>
            <span>Copyright @2026 Reserved For PSD</span>
        </footer>
    </div>
</body>
</html>
<script src="scripts/register.js"></script>
